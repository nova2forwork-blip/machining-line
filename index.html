<!DOCTYPE html>
<html lang="th" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <!-- ★ 2026-10-15: ปิด "แปลหน้านี้" ของ Chrome/Google Translate — ตัวแปลไปห่อข้อความด้วย <font> แล้ว React พัง
         (removeChild: The node to be removed is not a child of this node) · แอปมีปุ่มสลับ TH/EN ของตัวเองอยู่แล้ว -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Artclad" />
    <meta name="description" content="Artclad Production — ระบบบันทึกการผลิต: Release, สแกน QR หน้าเครื่อง, รายงาน" />
    <!-- ★ 2026-10-15: Artclad Production · ไอคอน 2 แบบ: สำนักงาน = A ฟ้าบนพื้นขาว · หน้าเครื่อง/ประกอบ/แพ็ก/TV (ธีมมืด) = A ฟ้าบนพื้นเข้ม
         (สคริปต์ด้านล่างสลับตาม path ก่อนเบราว์เซอร์ใช้ → "เพิ่มลงหน้าจอ" ได้ไอคอน/ชื่อ/หน้าเริ่มต้นตามโหมดที่ใช้) -->
    <title>Artclad Production</title>
    <link id="mls-manifest" rel="manifest" href="/manifest-office.webmanifest" />
    <link id="mls-apple-icon" rel="apple-touch-icon" href="/icons/artclad-light-apple-180.png" />
    <link id="mls-favicon" rel="icon" type="image/png" href="/icons/artclad-light-favicon-64.png" />
    <script>
      (function () {
        try {
          var p = location.pathname.replace(/\/+$/, "").toLowerCase();
          var dark = /^\/(station|assembly|panel|glazing|packing|dashboard)(\/|-|$)/.test(p);
          if (!dark) return;
          document.getElementById("mls-manifest").href = "/manifest.webmanifest";
          document.getElementById("mls-apple-icon").href = "/icons/artclad-dark-apple-180.png";
          document.getElementById("mls-favicon").href = "/icons/artclad-dark-favicon-64.png";
          var t = document.querySelector('meta[name="theme-color"]'); if (t) t.content = "#111418";
          var a = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (a) a.content = "Artclad หน้าเครื่อง";
          var en = false; try { en = localStorage.getItem("mls-lang") === "en"; } catch (e) {} document.title = p.indexOf("/dashboard") === 0 ? "Artclad Production — TV" : (en ? "Artclad Production — Station" : "Artclad Production — หน้าเครื่อง");
        } catch (e) { /* ignore */ }
      })();
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #eef3f1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- หน้าโหลดชั่วคราว (inline ไม่พึ่ง bundle) — กัน "จอมืด" ระหว่างรีโหลด/อัปเดต
         โทนสีเข้มสำหรับ /dashboard และ /station · หน้าสำนักงานใช้โทนสว่างเดิม -->
    <script>
      (function () {
        try {
          var p = location.pathname.replace(/\/+$/, "").toLowerCase();
          var dark = p.indexOf("/dashboard") === 0 || p.indexOf("/station") === 0 || p.indexOf("/assembly") === 0 || p.indexOf("/packing") === 0;
          var bg = dark ? "#0b0f0d" : "#eef3f1";
          var fg = dark ? "#14e39a" : "#10b981";
          var track = dark ? "#24302a" : "#d7e3dd";
          document.body.style.background = bg;
          var st = document.createElement("style");
          st.textContent = "@keyframes bootspin{to{transform:rotate(360deg)}}";
          document.head.appendChild(st);
          var s = document.createElement("div");
          s.id = "boot-splash";
          s.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:" + bg + ";z-index:99999;transition:opacity .35s ease";
          s.innerHTML = '<div style="width:56px;height:56px;border:5px solid ' + track + ';border-top-color:' + fg + ';border-radius:50%;animation:bootspin 1s linear infinite"></div>';
          document.body.appendChild(s);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <!-- ★ รอบ 15: กันจอหมุนค้าง — ถ้าไฟล์โปรแกรมหลักโหลดไม่ขึ้น (เปิดหน้าไว้ระหว่าง deploy · แคช/เวอร์ชันเก่าค้าง)
         → ล้างแคช + ถอน service worker แล้วโหลดใหม่เอง 1 ครั้ง · ยังไม่ได้ = ขึ้นข้อความ + ปุ่ม "โหลดใหม่" (ไม่หมุนเงียบ)
         (ตัวกู้ใน main.jsx ช่วยไม่ได้ในกรณีนี้ เพราะไฟล์หลักไม่ได้ถูกโหลดเลย) -->
    <script>
      (function () {
        var KEY = "mls-healed";   // main.jsx ล้างให้เองเมื่อแอปเปิดสำเร็จ
        function th() { try { return (localStorage.getItem("mls-lang") || "th") !== "en"; } catch (e) { return true; } }
        function wipe() {
          var p = [];
          try { if (window.caches && caches.keys) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
          try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
          return Promise.all(p).catch(function () {});
        }
        function showMsg() {
          var s = document.getElementById("boot-splash"); if (!s) return;
          var t = th();
          s.innerHTML = '<div style="font-family:system-ui,sans-serif;text-align:center;color:#5a6a63;font-size:16px;line-height:1.6;padding:20px">'
            + (t ? "โหลดแอปไม่สำเร็จ (อาจเพิ่งอัปเดตเวอร์ชันใหม่)" : "The app didn't load (a new version may have just been deployed)")
            + '<br><button id="mls-boot-retry" style="margin-top:14px;font:inherit;font-weight:700;padding:10px 22px;border-radius:10px;border:0;background:#098259;color:#fff;cursor:pointer">'
            + (t ? "โหลดใหม่" : "Reload") + "</button></div>";
          var b = document.getElementById("mls-boot-retry");
          if (b) b.onclick = function () { wipe().then(function () { location.reload(); }); };
        }
        var fired = false;
        function heal() {
          if (fired) return; fired = true;
          var done = false;
          try { done = sessionStorage.getItem(KEY) === "1"; } catch (e) {}
          if (done) { showMsg(); return; }                       // ลองแล้วรอบนึง → ไม่วนซ้ำ ให้คนกดเอง
          if (navigator.onLine === false) {                      // ออฟไลน์: ห้ามล้างแคช (ไม่มีอะไรเสิร์ฟ) → รอเน็ตกลับ
            showMsg(); window.addEventListener("online", function () { location.reload(); }, { once: true }); return;
          }
          try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
          wipe().then(function () { location.reload(); });
        }
        // ไฟล์ .js ของแอป (/assets/…) โหลดไม่ขึ้น — รวมกรณีเซิร์ฟเวอร์ส่งหน้า HTML มาแทน (MIME text/html)
        window.addEventListener("error", function (e) {
          var el = e && e.target;
          if (el && el.tagName === "SCRIPT" && /\/assets\/|\/src\/main/.test(el.src || "")) heal();
        }, true);
        // เผื่อเคสอื่น: 45 วิ แล้วยังไม่มีอะไรขึ้น → บอกผู้ใช้ + ปุ่มโหลดใหม่ (ไม่รีโหลดเอง — เน็ตช้าอาจยังโหลดอยู่)
        setTimeout(function () {
          var r = document.getElementById("root");
          if (document.getElementById("boot-splash") && r && !r.childElementCount) showMsg();
        }, 45000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
